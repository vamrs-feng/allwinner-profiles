# Upstream: https://github.com/sddm/sddm/pull/2166
# ArchWiki KMSCON: add kmsconvt@tty1 to Conflicts/After of the display manager.
#
# Debian sddm.service already Conflicts/After getty@tty1 and getty@tty7.
# This board actually starts X on VT 2, so include tty2 as well.
[Unit]
Conflicts=kmsconvt@tty1.service kmsconvt@tty2.service kmsconvt@tty7.service
After=kmsconvt@tty1.service kmsconvt@tty2.service kmsconvt@tty7.service
